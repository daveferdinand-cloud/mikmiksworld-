<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Mika responsive verification</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}iframe{display:block;margin:0 auto;border:0;background:white;width:390px;height:820px}</style><header><label>Viewport width <select id="width"><option>390</option><option>768</option><option>1200</option></select></label><label>Room <select id="room"><option value="home">Home</option><option value="art/draw">Drawing</option><option value="stories">Writing</option><option value="recipes">Recipes</option><option value="plush">Plush</option><option value="music">Music</option></select></label><output id="result">390 px</output></header><iframe title="Mika responsive preview" src="/#home"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px';document.querySelector('output').value=e.target.value+' px'};document.querySelector('#room').onchange=e=>{frame.src='/#'+e.target.value};</script>
